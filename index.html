*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
:root{
  --paper:#f2ede3; --paper-2:#fbf7ee; --paper-3:#e9e2d4;
  --ink:#211f1a; --ink-2:#454138; --muted:#786f62;
  --rule:#d8cfbe; --rule-2:#b9ad98;
  --accent:#9b3028; --accent-2:#7d251f; --accent-ink:#fff8ef;
  --correct:#2f6b53; --wrong:#a33a30; --warn:#a8741c;
  --shadow:0 18px 50px rgba(41,32,18,.10);
  --shadow-sm:0 8px 24px rgba(41,32,18,.07);
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --maxw:1000px;
}
[data-theme="dark"]{
  --paper:#141512; --paper-2:#1c1e19; --paper-3:#24261f;
  --ink:#efe9dc; --ink-2:#c9c1b1; --muted:#a49a88;
  --rule:#33352c; --rule-2:#4b4c40;
  --accent:#e07968; --accent-2:#f09a88; --accent-ink:#1b1712;
  --correct:#79c5a1; --wrong:#e08a7b; --warn:#e0b05c;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --shadow-sm:0 8px 24px rgba(0,0,0,.25);
}
html,body{min-height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.55;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(255,255,255,.55), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(120,100,70,.045) 31px 32px),
    var(--paper);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
[data-theme="dark"] body{
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(255,255,255,.04), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.025) 31px 32px),
    var(--paper);
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:100; opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  mix-blend-mode:multiply;
}
[data-theme="dark"] body::before{mix-blend-mode:screen;opacity:.04}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08;letter-spacing:-.02em;margin:0}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:var(--accent-ink)}
.eyebrow{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:10px 14px;z-index:999;border-radius:4px}
.skip:focus{left:8px}
#app{position:relative;z-index:1}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.view{animation:fade .35s ease both}
@keyframes fade{from{opacity:1;transform:translateY(4px)}to{opacity:1;transform:none}}
.text-btn{font-size:.75rem;color:var(--muted);text-decoration:underline;text-underline-offset:2px;transition:color .15s}
.text-btn:hover{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:6px;border:1px solid var(--ink);font-size:.82rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:transform .15s,background .15s,color .15s,border-color .15s;background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--paper-2);border-color:var(--rule-2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:40px;padding:0 16px;font-size:.68rem}
.btn[disabled]{opacity:.3;pointer-events:none}

/* ---------- home ---------- */
.home{min-height:100vh;padding:clamp(24px,5vw,56px) 0 48px}
.home-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(28px,6vw,72px);align-items:start}
.masthead{position:sticky;top:clamp(20px,4vw,36px)}
.masthead .eyebrow{margin-bottom:18px}
.wordmark{display:flex;align-items:baseline;gap:.28em;flex-wrap:wrap;margin:0 0 18px}
.wm-main{font-family:var(--serif);font-weight:700;font-size:clamp(4.6rem,15vw,8rem);line-height:.78;letter-spacing:-.055em}
.wm-sub{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(1rem,2.5vw,1.35rem);color:var(--accent);transform:translateY(-.15em)}
.lede{font-size:clamp(1.02rem,1.6vw,1.15rem);line-height:1.5;color:var(--ink-2);max-width:34ch;margin:18px 0 22px}
.masthead-rule{height:1px;background:var(--accent);width:64px;margin:22px 0}
.masthead-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.78rem;color:var(--muted)}
.masthead-meta span{display:inline-flex;align-items:center;gap:7px}
.masthead-meta span::before{content:"";width:5px;height:5px;background:var(--accent);border-radius:50%}
.masthead-note{margin-top:26px;font-size:.78rem;line-height:1.55;color:var(--muted);max-width:40ch}
.masthead-note a{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.contents-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:4px}
.contents-head h2{font-size:clamp(1.4rem,3vw,1.8rem)}
.contents-head .count{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.toc{list-style:none;margin:0;padding:0}
.toc li{border-bottom:1px solid var(--rule)}
button.toc-row{width:100%;text-align:left;cursor:pointer}
button.back{cursor:pointer}
.toc-row{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:15px 8px 14px 0;transition:background .18s,transform .18s}
.toc-row:hover{background:linear-gradient(90deg,rgba(155,48,40,.06),transparent 62%);transform:translateX(3px)}
.toc-num{font-family:var(--serif);font-style:italic;font-size:1.08rem;color:var(--c,var(--accent));letter-spacing:.02em;grid-column:1;grid-row:1}
.toc-main{min-width:0;grid-column:2;grid-row:1}
.toc-name{display:block;font-family:var(--serif);font-size:clamp(1.02rem,2vw,1.22rem);font-weight:600;line-height:1.2}
.toc-meta{display:block;font-size:.74rem;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.toc-status{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-align:right;grid-column:3;grid-row:1}
.toc-status strong{color:var(--ink);font-weight:600}
.toc-bar{grid-column:2/-1;grid-row:2;height:2px;background:var(--rule);position:relative;overflow:hidden;border-radius:2px}
.toc-bar i{display:block;height:100%;width:0;background:var(--c,var(--accent));transition:width .5s ease}
.toc-row:hover .toc-name{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.site-foot{margin-top:42px;padding-top:16px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.foot-actions{display:flex;gap:10px;flex-wrap:wrap}
.foot-note{max-width:52ch;line-height:1.5}

/* ---------- subject ---------- */
.subject{padding:clamp(20px,4vw,48px) 0 56px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:28px;transition:color .15s}
.back:hover{color:var(--ink)}
.subject-hero{position:relative;border-bottom:2px solid var(--ink);padding-bottom:26px;margin-bottom:30px}
.subject-kicker{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.subject-code{font-family:var(--serif);font-style:italic;font-size:1.08rem;color:var(--c,var(--accent))}
.subject-title{font-size:clamp(2.3rem,7vw,4.4rem);letter-spacing:-.045em;line-height:.95}
.subject-sub{margin-top:10px;color:var(--muted);font-size:.9rem}
.subject-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:26px 0}
.subject-stats div{background:var(--paper-2);padding:14px 16px}
.subject-stats dt{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.subject-stats dd{font-family:var(--serif);font-size:1.4rem;margin:2px 0 0;line-height:1.1}
.subject-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,5vw,56px);align-items:start}
.note-box{background:var(--paper-2);border:1px solid var(--rule);border-left:3px solid var(--c,var(--accent));padding:20px 22px;border-radius:0 8px 8px 0}
.note-box h2{font-size:1.06rem;margin-bottom:10px}
.note-box p{font-size:.88rem;color:var(--ink-2);line-height:1.6}
.note-box ul{margin:10px 0 0;padding-left:18px;font-size:.88rem;color:var(--ink-2)}
.note-box li+li{margin-top:5px}
.progress-card{background:var(--paper-2);border:1px solid var(--rule);padding:20px 22px;border-radius:8px;box-shadow:var(--shadow-sm)}
.progress-card .big{font-family:var(--serif);font-size:2.4rem;line-height:1}
.progress-card .big span{font-size:1.1rem;color:var(--muted)}
.progress-card .cap{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.progress-card p{font-size:.8rem;color:var(--muted);margin-top:8px}
.bar{height:4px;background:var(--rule);border-radius:4px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--c,var(--accent));transition:width .5s}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.actions .btn{flex:1;min-width:150px}
.actions .text-btn{flex:1 0 100%;text-align:left;margin-top:4px}

/* ---------- test ---------- */
.test{padding-bottom:120px;min-height:100vh}
.testbar{position:sticky;top:0;z-index:20;background:var(--paper);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--rule)}
.testbar-inner{display:flex;align-items:center;gap:10px;padding:9px clamp(12px,3vw,28px);max-width:var(--maxw);margin:0 auto}
.icon-btn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule);border-radius:50%;background:var(--paper-2);font-size:1.05rem;transition:background .15s,border-color .15s,transform .15s;flex:0 0 auto}
.icon-btn:hover{border-color:var(--ink);background:var(--paper-3);transform:translateY(-1px)}
.testbar-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.testbar-title .eyebrow{font-size:.58rem;letter-spacing:.12em}
.testbar-title strong{font-family:var(--serif);font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.timer{text-align:right;margin-right:2px;min-width:74px}
.timer-label{display:block;font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.timer-val{font-family:var(--mono);font-size:.86rem;font-variant-numeric:tabular-nums}
.timer-val.over{color:var(--warn)}
.progressline{height:3px;background:var(--rule);position:relative}
.progressline i{display:block;height:100%;background:var(--c,var(--accent));transition:width .35s}
.sheet{max-width:760px;margin:clamp(18px,4vw,34px) auto 0;padding:0 clamp(10px,3vw,24px)}
.sheet-card{background:var(--paper-2);border:1px solid var(--rule);border-left:3px solid var(--c,var(--accent));border-radius:0 12px 12px 0;padding:clamp(16px,4vw,32px);box-shadow:var(--shadow-sm);position:relative}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.stamp{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:34px;padding:0 9px;border:1.5px solid var(--accent);color:var(--accent);font-family:var(--serif);font-weight:600;font-size:.9rem;border-radius:3px;transform:rotate(-1.5deg);letter-spacing:.04em;background:rgba(155,48,40,.03)}
[data-theme="dark"] .stamp{background:rgba(224,121,104,.06)}
.sheet-part{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);text-align:right}
.answer{margin-top:22px;padding-top:18px;border-top:1px dashed var(--rule-2)}
.answer-label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.answer-label .hint{letter-spacing:.02em;text-transform:none;font-size:.72rem;color:var(--muted);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,1.5vw,10px);max-width:500px}
.tile{position:relative;aspect-ratio:1/1;min-height:48px;border:1px solid var(--rule-2);border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:clamp(1.1rem,3vw,1.45rem);font-weight:600;transition:transform .14s,background .14s,color .14s,border-color .14s,box-shadow .14s}
.tile:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 4px 0 rgba(41,32,18,.08)}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:rotate(-1.2deg) scale(1.02);box-shadow:0 4px 0 rgba(125,37,31,.22)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:6px;font-size:.6rem;font-family:var(--sans);opacity:.9}
.answer-input{width:100%;max-width:560px;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:10px 2px;font-family:var(--serif);font-size:clamp(1.25rem,4vw,1.65rem);outline:none;color:var(--ink);border-radius:0}
.answer-input::placeholder{color:var(--muted);font-family:var(--sans);font-size:.86rem;letter-spacing:.02em}
.answer-input:focus{border-bottom-color:var(--accent)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.bottombar-inner{max-width:760px;margin:0 auto;padding:9px clamp(12px,3vw,24px);display:flex;align-items:center;gap:9px}
.bottombar .btn{flex:1;min-height:48px;padding:0 12px}
.bottombar .counter{font-family:var(--mono);font-size:.72rem;color:var(--muted);min-width:56px;text-align:center}

/* ---------- figures ---------- */
.figures{display:flex;flex-direction:column;gap:12px}
.figure{margin:0;position:relative}
.fig-btn{display:block;width:fit-content;max-width:100%;padding:0;border:1px solid var(--rule);border-radius:6px;background:#fff;overflow:hidden;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.fig-btn img{width:auto;max-width:100%;height:auto;display:block;margin:0 auto}
.fig-btn .zoom-hint{position:absolute;right:8px;bottom:8px;background:rgba(20,18,14,.78);color:#fff;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:4px;opacity:0;transition:opacity .15s}
.fig-btn:hover .zoom-hint{opacity:1}
.fig-btn{touch-action:manipulation;-webkit-touch-callout:none}
.fig-btn img{-webkit-user-drag:none;user-select:none}
.fig-hint{display:none;margin-top:6px;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (hover:none){.fig-hint{display:block}}
.instruction{margin:0 0 14px;padding:10px 14px;border-left:3px solid var(--accent);background:rgba(155,48,40,.06);border-radius:0 6px 6px 0;font-family:var(--serif);font-style:italic;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.5;color:var(--ink)}
[data-theme="dark"] .instruction{background:rgba(224,121,104,.10)}
.cont{align-self:center;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin:2px 0}
.cont::before,.cont::after{content:"";height:1px;background:var(--rule);flex:1}
.passage{margin:0 0 16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);overflow:hidden}
.passage summary{cursor:pointer;padding:10px 14px;font-family:var(--sans);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
.passage summary::-webkit-details-marker{display:none}
.passage summary::before{content:"▸";font-size:.8rem;transition:transform .15s;flex:0 0 auto}
.passage[open] summary::before{transform:rotate(90deg)}
.passage-body{padding:0 16px 16px;font-family:var(--serif);font-style:italic;font-size:clamp(.98rem,2.7vw,1.08rem);line-height:1.65;color:var(--ink)}
.passage-body strong{font-style:normal;font-weight:700;background:rgba(155,48,40,.09);padding:0 2px;border-radius:2px}
[data-theme="dark"] .passage-body strong{background:rgba(224,121,104,.16)}
.options-block{margin-top:18px}
.options-block h3{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--sans);font-weight:600;margin-bottom:8px}

/* ---------- results ---------- */
.result{padding:clamp(20px,4vw,48px) 0 56px}
.result-hero{position:relative;border-bottom:2px solid var(--ink);padding-bottom:28px;margin-bottom:24px}
.result-title{font-size:clamp(2rem,6vw,3.1rem);line-height:1;margin-top:8px}
.score-line{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.score{font-family:var(--serif);font-size:clamp(4rem,16vw,7rem);line-height:.78;letter-spacing:-.06em}
.score-total{font-family:var(--serif);font-size:clamp(1.3rem,4vw,2rem);color:var(--muted)}
.score-pct{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,3vw,1.7rem);color:var(--accent);margin-left:4px}
.mark-stamp{position:absolute;right:0;top:26px;border:2px solid var(--accent);color:var(--accent);padding:8px 12px;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;transform:rotate(-6deg);opacity:.82;border-radius:3px;font-weight:600;max-width:190px;text-align:center;line-height:1.3}
.result-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:20px 0}
.result-stats div{background:var(--paper-2);padding:12px 14px}
.result-stats dt{font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.result-stats dd{font-family:var(--serif);font-size:1.18rem;margin:2px 0 0;line-height:1.15}
.dist{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--rule);margin:8px 0 6px}
.dist i{height:100%}
.dist .ok{background:var(--correct)}
.dist .part{background:var(--warn)}
.dist .bad{background:var(--wrong)}
.dist .skip{background:var(--rule-2)}
.dist-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.68rem;color:var(--muted)}
.dist-legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.result-actions .btn{flex:1;min-width:150px}
.result-note{font-size:.72rem;color:var(--muted);margin-top:16px;line-height:1.55;max-width:60ch}

/* ---------- review ---------- */
.review{padding:clamp(20px,4vw,48px) 0 64px}
.review-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:18px}
.review-head h1{font-size:clamp(2rem,5vw,3rem)}
.review-summary{font-size:.8rem;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 22px}
.filter{padding:8px 12px;border:1px solid var(--rule-2);border-radius:4px;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--paper-2);transition:background .15s,color .15s,border-color .15s}
.filter:hover{border-color:var(--ink);color:var(--ink)}
.filter.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.review-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.review-item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:13px;border:1px solid var(--rule);background:var(--paper-2);border-radius:8px;padding:15px}
.review-mark{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:.95rem;border:1.5px solid currentColor}
.review-item.ok .review-mark{color:var(--correct)}
.review-item.part .review-mark{color:var(--warn)}
.review-item.bad .review-mark{color:var(--wrong)}
.review-item.skip .review-mark{color:var(--warn)}
.review-body{min-width:0}
.review-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.review-title .stamp{height:28px;min-width:36px;font-size:.78rem}
.review-status{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.review-item.ok .review-status{color:var(--correct)}
.review-item.part .review-status{color:var(--warn)}
.review-item.bad .review-status{color:var(--wrong)}
.review-item.skip .review-status{color:var(--warn)}
.review-answers{font-size:.82rem;color:var(--ink-2);line-height:1.55;margin-bottom:6px}
.review-answers b{font-weight:600;color:var(--ink)}
.review-answers .correct{color:var(--correct);font-weight:600}
.review-answers .partial{color:var(--warn);font-weight:600}
.review-answers .wrong{color:var(--wrong);font-weight:600}
.review-answers .muted{color:var(--muted)}
details{border-top:1px dashed var(--rule);margin-top:8px;padding-top:8px}
summary{cursor:pointer;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 0;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-family:var(--mono);font-size:.9rem;width:14px;color:var(--accent)}
details[open] summary::before{content:"−"}
details .details-inner{padding:10px 0 4px}
.empty{border:1px dashed var(--rule-2);padding:32px;text-align:center;color:var(--muted);border-radius:8px;font-size:.9rem}

/* ---------- modal ---------- */
.modal-open{overflow:hidden}
.modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(18,16,12,.55);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal{background:var(--paper-2);color:var(--ink);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;border:1px solid var(--rule);box-shadow:var(--shadow);padding:24px;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1);position:relative}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.modal h2{font-size:1.45rem;margin-bottom:8px;padding-right:28px}
.modal p{font-size:.88rem;color:var(--ink-2);line-height:1.55}
.modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.modal-actions .btn{flex:1;min-width:130px}
.modal-close{position:absolute;top:8px;right:10px;font-size:1.35rem;line-height:1;padding:8px;color:var(--muted)}
.sources-list{margin:10px 0 0;padding-left:18px;max-height:46vh;overflow:auto;font-size:.8rem;line-height:1.5}
.sources-list li{margin:3px 0}
.sources-list a{color:var(--accent);word-break:break-word}
.modal-note{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:8px}
@media(min-width:640px){.modal-backdrop{align-items:center;padding:24px}.modal{border-radius:12px}}
.nav-parts{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.nav-part h3{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--sans);margin-bottom:7px}
.nav-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.nav-cell{height:40px;border:1px solid var(--rule-2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:.88rem;background:var(--paper);position:relative;transition:background .15s,border-color .15s}
.nav-cell.answered{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--accent-ink)}
.nav-cell.current{outline:2px solid var(--ink);outline-offset:2px}
.nav-cell:hover{border-color:var(--ink)}
.nav-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.66rem;color:var(--muted);margin-top:10px}
.nav-legend span{display:inline-flex;align-items:center;gap:6px}
.nav-dot{width:10px;height:10px;border-radius:3px;border:1px solid var(--rule-2);display:inline-block}
.nav-dot.on{background:var(--accent);border-color:var(--accent)}
.nav-dot.cur{outline:2px solid var(--ink);outline-offset:1px}
.lightbox{position:fixed;inset:0;z-index:1100;background:rgba(10,9,7,.94);display:flex;flex-direction:column;animation:fade .2s}
.lightbox-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 96px;display:flex;align-items:flex-start;justify-content:flex-start;touch-action:pan-x pan-y pinch-zoom}
.lightbox-scroll img{flex:0 0 auto;max-width:100%;width:auto;height:auto;margin:auto;background:#fff;border-radius:4px;user-select:none;-webkit-user-drag:none}
.lightbox-tools{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;display:flex;gap:8px;align-items:center;background:rgba(24,22,18,.92);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px}
.lightbox-tools button{min-width:42px;height:38px;padding:0 12px;border:0;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-family:var(--sans);font-size:.85rem;font-weight:600}
.lightbox-tools button:active{background:rgba(255,255,255,.28)}
.lightbox-close{position:fixed;top:12px;right:12px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:1.55rem;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25)}
.lightbox-hint{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.55);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}

@media(max-width:820px){
  .home-grid{grid-template-columns:1fr;gap:32px}
  .masthead{position:static}
}
@media(max-width:760px){
  .subject-grid{grid-template-columns:1fr}
}
@media(max-width:620px){
  .result-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mark-stamp{position:static;display:inline-block;margin-top:16px;transform:rotate(-3deg)}
  .toc-row{grid-template-columns:34px minmax(0,1fr);gap:4px 12px}
  .toc-status{grid-column:2;grid-row:2;text-align:left;margin-top:-2px}
  .toc-bar{grid-column:2;grid-row:3}
  .answer-label{flex-direction:column;align-items:flex-start;gap:3px}
  .answer-label .hint{text-align:left}
}
@media(max-width:380px){
  .wm-main{font-size:4.2rem}
  .tile{min-height:44px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media print{
  .testbar,.bottombar,.result-actions,.filters,.back,.site-foot,.answer,.fig-btn .zoom-hint{display:none!important}
  body{background:#fff;color:#000}
  .fig-btn{border:0}
  .sheet-card,.review-item,.note-box,.progress-card{box-shadow:none}
}
</style>
</head>
<body>
<a class="skip" href="#app">К содержанию</a>
<div id="app" tabindex="-1"></div>

,"label":"В12","part":"B","type":"input","answer":"2","answerText":"2","maxPoints":2,"partial":false,"prompt":["02_q030_p21_1083.avif"],"options":[],"solution":["02_s030_p21_1083.avif"],"passageTitle":"Тэкст да заданняў В12–В22","passage":"(1) Той нядзельны світанак пачаўся з навальніцы. (2) Моцны вецер налятаў з усіх бакоў. (3) Сінія зігзагі бліскавіц імкліва разразалі чорныя хмары. (4) Цяжкія ўдары грому раз за разам скаланалі паветра над вёскай. (5) Перад абедам дождж сціх і грымоты пачалі (прыбліжацца, аддаляцца). (6) Калі Рыгор выйшаў з хаты, хмары ўжо павіслі далёка над лесам, а ў небе над вёскай вось-вось павінна было <strong>паказацца<\/strong> сонейка. (7) Раптам <strong>хлопец<\/strong> убачыў каля ганка <strong>жэрдку<\/strong>. (8) Не змог адарваць разам са шпакоўняй ад дрэва вецер. (9) Рыгор, не раздумваючы, падбег да шпакоўні. (10) Калі падняў птушыную хатку, адтуль па чарзе пачалі выпырхваць і разлятацца ў розныя бакі шпачкі. (11) Толькі адзін з іх хоць і стараўся, але ўсё ж вымушаны быў <strong>прызямліцца<\/strong>. (12) Магчыма, ён яшчэ не навучыўся лятаць. (13) Юнак паклаў птушачку ў шапку і асцярожна панёс у <strong>цёплую<\/strong> хату. (14) Ішоў час. (15) Шпачок дужэў і прыгажэў. (16) Ад яго бліскучага апярэння, чорнага, з фіялетава-зялёным <strong>адлівам<\/strong>, было вачэй не адвесці. (17) Шпак любіў <strong>палятаць<\/strong> па хаце, <strong>таемна<\/strong> наведаць <strong>падаконнік<\/strong> і падзяўбці вазоны. (18) Але найбольш ён упадабаў купанне ў місцы з цёплай вадой. (19) (Самы) незвычайнымі для хатніх былі хвіліны, калі ён, знаходзячыся ў добрым настроі, пачынаў занадта гучна спяваць або крычаць пеўнем, заўзята клекатаць бўслам або мяўкаць, пераймаць скрып дзвярэй. (20) Шпака, якому далі мянушку Розік, усе любілі і песцілі. (21) Сам жа Розік найбольш выдзяляў Рыгора – свайго выратавальніка.","instruction":""},{"id":"02-В13","label":"В13","part":"B","type":"input","answer":"хлопец","answerText":"хлопец","maxPoints":2,"partial":       if(a==='in')zoom=Math.min(5,zoom*1.5);
      else if(a==='out')zoom=Math.max(1,zoom/1.5);
      else if(a==='fit')zoom=1;
      else if(a==='one')zoom=Math.max(1,img.naturalWidth/base());
      apply();
    });
  });
  if(img){
    img.addEventListener('dblclick',()=>{zoom=zoom>1.001?1:2.5;apply();});
    img.addEventListener('load',apply,{once:true});
  }
  box.addEventListener('click',e=>{if(e.target===box)closeModal();});
  const btn=modalRoot.querySelector('.lightbox-close');if(btn)try{btn.focus();}catch(e){}
}

/* ---------- figures ---------- */
function figures(files,alt){
  if(!files||!files.length)return '';
  return `<div class="figures">${files.map((f,i)=>`
    <figure class="figure">
      <button class="fig-btn" data-action="zoom" data-img="${esc(f)}" aria-label="Увеличить: ${esc(alt)}">
        <img src="${IMG[f]||''}" alt="${esc(alt)}${files.length>1?' — часть '+(i+1):''}" loading="lazy" decoding="async" draggable="false">
        <span class="zoom-hint">увеличить</span>
      </button>
      ${i===0?'<div class="fig-hint">нажмите, чтобы увеличить</div>':''}
      ${i<files.length-1?'<div class="cont">продолжение</div>':''}
    </figure>`).join('')}</div>`;
}

function instructionBlock(q){
  if(!q.instruction)return '';
  return `<div class="instruction">${q.instruction}</div>`;
}

function passageBlock(q){
  if(!q.passage)return '';
  return `<details class="passage" open><summary>${esc(q.passageTitle||'Текст')}</summary><div class="passage-body">${q.passage}</div></details>`;
}

/* ---------- answers ---------- */
let saveTimer=null;
function setAnswer(code,qid,value){
  const x=st(code);
  if(value.trim())x.answers[qid]=value;else delete x.answers[qid];
  clearTimeout(saveTimer);saveTimer=setTimeout(save,220);
}
function pick(code,qid,n){
  const x=st(code);
  let arr=Array.isArray(x.answers[qid])?x.answers[qid].slice():[];
  if(arr.includes(n))arr=arr.filter(v=>v!==n);else arr.push(n);
  arr.sort((a,b)=>a-b);
  if(arr.length)x.answers[qid]=arr;else delete x.answers[qid];
  save();
  document.querySelectorAll('.tile').forEach(t=>{
    if(t.dataset.q===qid)t.setAttribute('aria-pressed',String(arr.includes(Number(t.dataset.n))));
  });
}
function goPrev(code){
  const x=st(code);
  if(x.index>0){x.index--;save();renderTest(code);window.scrollTo(0,0);}
}
function goNext(code){
  const s=subj(code),x=st(code);
  if(x.index>=s.questions.length-1){tryFinish(code);return;}
  x.index++;save();renderTest(code);window.scrollTo(0,0);
}

/* ---------- results ---------- */
function computeResult(code){
  const s=subj(code),x=st(code);
  let score=0,maxScore=0,correct=0,partial=0,wrong=0,unanswered=0,answered=0;
  const byPart={};
  s.questions.forEach(q=>{
    const v=x.answers[q.id];
    const a=isAnswered(q,v);
    const pts=pointsFor(q,v);
    const max=maxPts(q);
    score+=pts;maxScore+=max;
    if(!byPart[q.part])byPart[q.part]={score:0,max:0,correct:0,partial:0,wrong:0,unanswered:0,answered:0,total:0};
    const bp=byPart[q.part];bp.total++;bp.score+=pts;bp.max+=max;
    if(pts===max){correct++;bp.correct++;}
    else if(pts>0){partial++;bp.partial++;}
    else if(a){wrong++;bp.wrong++;}
    else {unanswered++;bp.unanswered++;}
    if(a){answered++;bp.answered++;}
  });
  const conv=s.conv||[];
  const test=conv[score]!=null?conv[score]:Math.round(score/maxScore*100);
  return {score,maxScore,test,correct,partial,wrong,unanswered,answered,total:s.questions.length,percent:test,byPart,elapsed:x.elapsed||0,date:Date.now()};
}
function finishAttempt(code){
  const x=st(code);
  const res=computeResult(code);
  x.finished=true;x.result=res;
  x.history=(x.history||[]).concat([{date:Date.now(),score:res.score,maxScore:res.maxScore,test:res.test,percent:res.percent,correct:res.correct,total:res.total,partial:res.partial,elapsed:res.elapsed}]).slice(-12);
  save();closeModal();stopTimer();
  navigate('results',code);
}
function tryFinish(code){
  const s=subj(code),x=st(code);
  const unanswered=s.questions.filter(q=>!isAnswered(q,x.answers[q.id])).length;
  if(!unanswered){finishAttempt(code);return;}
  showModal(`<h2>Завершить тест?</h2>
    <p>Без ответа осталось <b>${unanswered}</b> ${plural(unanswered,'задание','задания','заданий')}. После завершения вы увидите результат и разбор каждого задания.</p>
    <div class="modal-actions"><button class="btn ghost" data-action="close-modal">Вернуться</button><button class="btn primary" data-action="confirm-finish" data-code="${code}">Завершить</button></div>`);
}

/* ---------- review ---------- */
function renderReview(code){
  const s=subj(code),x=S.subjects[code];
  if(!x||!x.result){navigate('subject',code);return;}
  currentView='review';currentCode=code;
  const r=x.result;
  const info=s.questions.map((q,i)=>{
    const v=x.answers[q.id];
    const answered=isAnswered(q,v);
    const pts=pointsFor(q,v);
    const max=maxPts(q);
    const ok=pts===max;
    const isPart=pts>0&&pts<max;
    const cls=ok?'ok':isPart?'part':answered?'bad':'skip';
    const mark=ok?'✓':isPart?'±':answered?'✗':'—';
    const status=ok?'верно':isPart?'частично':answered?'ошибка':'без ответа';
    const user=fmtVal(q,v);
    const correct=fmtVal(q,q.answer);
    const answerClass=ok?'correct':isPart?'partial':answered?'wrong':'muted';
    const opts=q.options&&q.options.length?`<div class="options-block"><h3>Варианты ответа</h3>${figures(q.options,`Варианты к заданию ${q.label}`)}</div>`:'';
    const open=!ok?' open':'';
    const html=`<li class="review-item ${cls}">
      <div class="review-mark" aria-hidden="true">${mark}</div>
      <div class="review-body">

        <details${open}><summary>Задание</summary><div class="details-inner">${instructionBlock(q)}${passageBlock(q)}${figures(q.prompt,`Задание ${q.label}`)}${opts}</div></details>
        <details${open}><summary>Разбор</summary><div class="details-inner">${figures(q.solution,`Решение ${q.label}`)}</div></details>
      </div>
    </li>`;
    return {q,i,answered,pts,max,ok,isPart,cls,html};
  });
  const total=s.questions.length;
  const partCount=info.filter(x=>x.isPart).length;
  const badCount=info.filter(x=>x.answered&&!x.ok&&!x.isPart).length;
  const skipCount=info.filter(x=>!x.answered).length;
  let filtered=info;
  if(reviewFilter==='part')filtered=info.filter(x=>x.isPart);
  if(reviewFilter==='bad')filtered=info.filter(x=>x.answered&&!x.ok&&!x.isPart);
  if(reviewFilter==='skip')filtered=info.filter(x=>!x.answered);
  const list=filtered.length?`<ol class="review-list">${filtered.map(x=>x.html).join('')}</ol>`:`<div class="empty">Здесь пока пусто.</div>`;
  app.innerHTML=`<div class="view review" style="--c:${s.color}"><div class="wrap">

    <header class="review-head">
      <div><div class="eyebrow">Разбор · ${esc(s.name)}</div><h1>Задания и решения</h1></div>
      <div class="review-summary">${r.test} из 100 · первичный ${r.score} из ${r.maxScore} · верно ${r.correct} из ${total}</div>
    </header>
    <div class="filters">
      <button class="filter ${reviewFilter==='all'?'active':''}" data-action="filter" data-filter="all" data-code="${code}">Все ${total}</button>
      <button class="filter ${reviewFilter==='part'?'active':''}" data-action="filter" data-filter="part" data-code="${code}">Частично ${partCount}</button>
      <button class="filter ${reviewFilter==='bad'?'active':''}" data-action="filter" data-filter="bad" data-code="${code}">Ошибки ${badCount}</button>
      <button class="filter ${reviewFilter==='skip'?'active':''}" data-action="filter" data-filter="skip" data-code="${code}">Без ответа ${skipCount}</button>
    </div>
    ${list}
    <div class="result-actions" style="margin-top:24px">
      <button class="btn primary" data-action="restart" data-code="${code}">Пройти заново</button>
      <button class="btn ghost" data-action="nav" data-view="results" data-code="${code}">К результату</button>
    </div>
  </div></div>`;
}

/* ---------- navigator ---------- */
function showNavigator(code){
  const s=subj(code),x=st(code);
  const parts=s.parts.map(p=>{
    const qs=s.questions.filter(q=>q.part===p.key);
    return `<div class="nav-part"><h3>${p.title} · ${qs.length}</h3><div class="nav-grid">${qs.map(q=>{
      const idx=s.questions.indexOf(q);
      const answered=isAnswered(q,x.answers[q.id]);
      return `<button class="nav-cell ${answered?'answered':''} ${idx===x.index?'current':''}" data-action="jump" data-code="${code}" data-index="${idx}" aria-label="${q.label}${answered?', отвечено':''}">${q.label.slice(1)}</button>`;
    }).join('')}</div></div>`;
  }).join('');
  showModal(`<h2>Навигация</h2>
    <div class="nav-legend"><span><i class="nav-dot on"></i>отвечено</span><span><i class="nav-dot cur"></i>текущее</span><span><i class="nav-dot"></i>без ответа</span></div>
    <div class="nav-parts">${parts}</div>
    <div class="modal-actions"><button class="btn ghost" data-action="close-modal">Закрыть</button><button class="btn accent" data-action="try-finish" data-code="${code}">Завершить тест</button></div>`);
}

/* ---------- start / reset ---------- */
function startNew(code){
  const x=st(code);
  x.answers={};x.index=0;x.elapsed=0;x.startedAt=Date.now();x.finished=false;x.result=null;
  save();navigate('test',code);
}
function resume(code){
  const x=st(code);
  if(!x||x.finished){startNew(code);return;}
  if(!x.startedAt)x.startedAt=Date.now();
  navigate('test',code);
}
function confirmRestart(code){
  const x=S.subjects[code];
  const answered=x?answeredCount(code):0;
  if(!answered){startNew(code);return;}
  showModal(`<h2>Начать заново?</h2><p>Текущие ответы (${answered}) будут удалены. История результатов сохранится.</p>
    <div class="modal-actions"><button class="btn ghost" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-restart" data-code="${code}">Начать заново</button></div>`);
}
function confirmResetSubject(code){
  const s=subj(code);
  showModal(`<h2>Сбросить предмет?</h2><p>Ответы, текущая попытка и история результатов по предмету «${esc(s.name)}» будут удалены.</p>
    <div class="modal-actions"><button class="btn ghost" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-reset-subject" data-code="${code}">Сбросить</button></div>`);
}
function confirmResetAll(){
  showModal(`<h2>Сбросить весь прогресс?</h2><p>Будут удалены ответы, текущие попытки и история по всем предметам. Это действие нельзя отменить.</p>
    <div class="modal-actions"><button class="btn ghost" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-reset-all">Сбросить всё</button></div>`);
}

function showSources(){
  const pdfs=[
    ['01','Русский язык'],['02','Белорусский язык'],['03','Физика'],
    ['04','Математика'],['05','Химия'],['06','Биология'],
    ['07','Английский язык'],['11','История Беларуси'],
    ['12','Обществоведение'],['13','География']
  ];
  const items=pdfs.map(([c,n])=>`<li>${n}: <a href="https://result.rikc.by/ru/free/consult/${c}.pdf" target="_blank" rel="noopener">result.rikc.by/ru/free/consult/${c}.pdf</a></li>`).join('');
  showModal(`<h2>Источники и права</h2>
    <p>Задания, официальные решения и изображения взяты из PDF, которые РИКЗ размещает в открытом доступе на <a href="https://result.rikc.by/ru/free/Default.aspx" target="_blank" rel="noopener">result.rikc.by</a>. Это неофициальный тренажёр; он не связан с РИКЗ.</p>
    <p class="modal-note">Материалы принадлежат РИКЗ и используются здесь в образовательных целях для подготовки к ДРТ. Если вы правообладатель и считаете публикацию нарушением, сообщите через Issues репозитория — материал будет удалён.</p>
    <ul class="sources-list">${items}<li>Схема начисления первичных баллов: <a href="https://result.rikc.by/ru/free/fb__26n.pdf" target="_blank" rel="noopener">fb__26n.pdf</a></li><li>Калькулятор перевода: <a href="https://result.rikc.by/ru/free/calc.html" target="_blank" rel="noopener">calc.html</a> и <a href="https://result.rikc.by/ru/free/test.php" target="_blank" rel="noopener">test.php</a></li><li>Статья о ДРТ: <a href="https://teenage.by/article/kak-projti-distancionnoe-rt" target="_blank" rel="noopener">teenage.by</a></li></ul>
    <div class="modal-actions"><button class="btn primary" data-action="close-modal">Понятно</button></div>`);
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action;
  if(a==='theme')toggleTheme();
  else if(a==='sources')showSources();
  else if(a==='reset-all')confirmResetAll();
  else if(a==='reset-subject')confirmResetSubject(el.dataset.code);
  else if(a==='start')startNew(el.dataset.code);
  else if(a==='resume')resume(el.dataset.code);
  else if(a==='restart')confirmRestart(el.dataset.code);
  else if(a==='confirm-restart'){closeModal();startNew(el.dataset.code);}
  else if(a==='confirm-reset-subject'){const code=el.dataset.code;delete S.subjects[code];save();navigate('subject',code);}
  else if(a==='confirm-reset-all'){S=clone(DEFAULT);save();applyTheme();navigate('home');}
  else if(a==='nav')navigate(el.dataset.view,el.dataset.code);
  else if(a==='pick')pick(el.dataset.code,el.dataset.q,Number(el.dataset.n));
  else if(a==='prev')goPrev(el.dataset.code);
  else if(a==='next'){const code=el.dataset.code;const s=subj(code),x=st(code);if(x.index>=s.questions.length-1)tryFinish(code);else goNext(code);}
  else if(a==='try-finish')tryFinish(el.dataset.code);
  else if(a==='confirm-finish'){const code=el.dataset.code;closeModal();finishAttempt(code);}
  else if(a==='navigator')showNavigator(el.dataset.code);
  else if(a==='jump'){const code=el.dataset.code;const x=st(code);x.index=Number(el.dataset.index);save();closeModal();renderTest(code);window.scrollTo(0,0);}
  else if(a==='zoom')openLightbox(el.dataset.img);
  else if(a==='close-modal')closeModal();
  else if(a==='filter'){reviewFilter=el.dataset.filter;renderReview(el.dataset.code);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});

/* ---------- boot ---------- */
applyTheme();
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const fn=()=>{if((S.settings.theme||'auto')==='auto')applyTheme();};
  if(mq.addEventListener)mq.addEventListener('change',fn);else if(mq.addListener)mq.addListener(fn);
}
navigate('home');
})();
</script>
</body>
</html>
